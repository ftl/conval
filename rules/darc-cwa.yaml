identifier: DARC-CWA
name: DARC CW-Training Contest
official_rules: https://www.darc.de/der-club/referate/conteste/cwa/darc-cwa-ausschreibung/
upload_url: https://dxhf2.darc.de/~accwlog/upload.cgi?form=referat&lang=de
upload_format: cabrillo
duration: 1h
duration-constraints:
breaks:
categories:
  - name: SO Low
    operator_mode: single
    tx: one
    power: low
    bands: [all]
    modes: [cw]
overlays:
modes:
  - cw
bands:
  - 80m
band_change_rules:
properties:
  - name: wag_dok
    expression: "\\d*[A-Z][A-Z0-9ÄÖÜ-]*"
exchange:
  - their_country: [dl]
    fields:
      - [rst]
      - [nm, wag_dok]
  - fields:
      - [rst]
      - [serial]
scoring:
  qsos:
    - value: 1
  qso_band_rule: once_per_band
  multis:
    - property: wag_dok
      band_rule: once_per_band
      value: 1
    - property: wpx_prefix
      band_rule: once_per_band
      value: 1
examples:
  - setup:
      my_continent: eu
      my_country: dl
      bands: [80m]
      modes: [cw]
    qsos:
      - their_call: dl1abc
        their_exchange: [599, b36]
        band: 80m
        mode: cw
        points: 1
        multis: 2
        duplicate: false
      - their_call: dl1bcd
        their_exchange: [599, b26]
        band: 80m
        mode: cw
        points: 1
        multis: 1
        duplicate: false
      - their_call: dl1cde
        their_exchange: [599, nm]
        band: 80m
        mode: cw
        points: 1
        multis: 0
        duplicate: false
      - their_call: df3abc
        their_exchange: [599, nm]
        band: 80m
        mode: cw
        points: 1
        multis: 1
        duplicate: false
      - their_call: dl1abc
        their_exchange: [599, b36]
        band: 80m
        mode: cw
        points: 1
        multis: 0
        duplicate: true
      - their_call: f1abc
        their_exchange: [599, 1]
        band: 80m
        mode: cw
        points: 1
        multis: 1
        duplicate: false
    score:
      qsos: 6
      points: 5
      multis: 5
      total: 25
