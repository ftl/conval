        their_exchange: [599, 11]
        their_continent: sa
        their_country: py
        band: 20m
        mode: cw
        points: 1
        multis: 2
        duplicate: false
      - their_call: dl1abc
        their_exchange: [599, 14]
        their_continent: eu
        their_country: dl
        band: 20m
