    values: [BJ, BM, CK, DA, DE, DU, DJ, GS, IM, KA, KC, KR, KT, KZ, MA, NA, NG, OG, OS, PU, PZ, RI, SB, SK, SL, ST, SI, VK, VT, VU, VZ, ZD, ZG, ZU]
