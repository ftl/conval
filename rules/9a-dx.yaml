  - their_country: [9a]
    fields:
      - [rst]
      - [9a_county]
  - fields:
      - [rst]
      - [itu_zone]
scoring:
  qsos:
    - my_country: [9a]
      their_country: [9a]
      additional_weight: 10
      value: 1
    - my_country: [9a]
      their_continent: [eu]
      bands: [160m, 80m]
      value: 4
    - my_country: [9a]
      their_continent: [eu]
      bands: [40m, 20m, 15m, 10m]
      value: 2
    - my_country: [9a]
      their_continent: [not, eu]
      bands: [160m, 80m]
      value: 10
    - my_country: [9a]
      their_continent: [not, eu]
      bands: [40m]
      value: 8
    - my_country: [9a]
      their_continent: [not, eu]
      bands: [20m, 15m, 10m]
      value: 6
    - my_country: [not, 9a]
      their_country: [9a]
      bands: [160m, 80m, 40m]
      additional_weight: 10
      value: 10
    - my_country: [not, 9a]
      their_country: [9a]
      bands: [20m, 15m, 10m]
      additional_weight: 10
      value: 6
    - my_country: [not, 9a]
      their_continent: [other]
      bands: [160m, 80m, 40m]
      value: 6
    - my_country: [not, 9a]
      their_continent: [other]
      bands: [20m, 15m, 10m]
      value: 3
    - my_country: [not, 9a]
      their_continent: [same]
      bands: [160m, 80m, 40m]
      value: 2
    - my_country: [not, 9a]
      their_continent: [same]
      bands: [20m, 15m, 10m]
      value: 1
  qso_bonuses:
    - time: {from: "23:00", to: "04:59"}
      value: 2
  qso_band_rule: once_per_band_and_mode
  multis:
    - property: itu_zone
      band_rule: once_per_band_and_mode
      value: 1
    - my_country: [not, 9a]
      property: 9a_county
      band_rule: once_per_band_and_mode
      value: 1
    - my_country: [9a]
      property: wae_entity
      band_rule: once_per_band_and_mode
      value: 1
