identifier: NRAU-CW
name: NRAU-Baltic Contest, CW
official_rules: https://nraubaltic.eu/rules
upload_url: https://logs.nraubaltic.eu/
upload_format: cabrillo
duration: 2h
duration-constraints:
breaks:
categories:
  - name: A - SO High
    operator_mode: single
    tx: one
    power: high
    bands: [all]
    modes: [cw]
  - name: B - SO Low
    operator_mode: single
    tx: one
    power: low
    bands: [all]
    modes: [cw]
  - name: C - MO
    operator_mode: multi
    bands: [all]
    modes: [cw]
overlays:
modes:
  - cw
bands:
  - 80m
  - 40m
