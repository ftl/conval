overlays:
  - rookie
  - teen
modes:
  - cw
bands:
  - 160m
  - 80m
  - 40m
  - 20m
  - 15m
  - 10m
band_change_rules:
properties:
  - name: brazilian_state
    values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
  - name: cva_military
    values: [MIL]
exchange:
  - their_country: [py]
    fields:
      - [rst]
      - [brazilian_state, cva_military]
  - fields:
      - [rst]
      - [continent, cva_military]
scoring:
  qsos:
    - their_country: [same]
      value: 2
    - their_country: [other]
      their_continent: [same]
      value: 3
    - their_continent: [other]
      value: 4
  qso_band_rule: once_per_band
  multis:
    - property: dxcc_entity
      band_rule: once_per_band
      value: 1
    - property: brazilian_state
      band_rule: once_per_band
      value: 1
examples:
