identifier: UBA-ON-CW
name: UBA ON Contest, CW
official_rules: https://www.uba.be/en/hf/contest-rules/on-contest
upload_url: https://contestupload.uba.be/
upload_format: cabrillo
duration: 4h
duration-constraints:
breaks:
categories:
  - name: A - ON
    bands: [all]
    modes: [cw]
  - name: A2 - ON QRP
    power: qrp
    bands: [all]
    modes: [cw]
  - name: B - ONL
    bands: [all]
  - name: D - Foreign
    bands: [all]
    modes: [cw]
  - name: E - Foreign SWL
    bands: [all]
  - name: Checklog
overlays:
modes:
  - cw
bands:
  - 80m
  - 40m
band_change_rules:
properties:
  - name: uba_section
    values: [AAA, ACC, ALT, ARA, ARC, ATH, ATO, BDX, BLW, BRC, BSE, BTS, BXE, CDZ, CLR, CPN, CRD, DNZ, DRC, DST, EKO, ERA, GBN, GBX, GDV, GNT, GTM, HAC, HCC, HOB, HRT, IPR, KSD, KTK, LGE, LIR, LLV, LUS, LVN, MCL, MLB, MNS, MTT, MWV, NBT, NLB, NMR, NNV, NOK, NOL, OBR, ODE, ONZ, ORA, OSA, OSB, OST, PHI, RAC, RAF, RAM, RAT, RBO, RCA, RCN, REM, RST, RSX, SNW, TLS, TOR, TRA, TRC, TWS, UBA, VHF, WLD, WRA, WRC, WTO, XXX, ZLB, ZLZ, ZTM]
exchange:
  - their_country: [on]
    fields:
      - [rst]
      - [serial]
      - [uba_section]
  - fields:
      - [rst]
      - [serial]
scoring:
  qsos:
    - my_country: [on]
      value: 3
    - my_country: [not, on]
      their_country: [on]
      value: 3
  qso_band_rule: once_per_band
  multis:
    - property: uba_section
      except: [XXX]
      band_rule: once_per_band
      value: 1
    - my_country: [on]
      property: dxcc_entity
      except: [on]
      band_rule: once_per_band
      value: 1
