  - setup:
      my_continent: eu
      my_country: on
      bands: [80m, 40m]
      modes: [cw]
    qsos:
      - their_call: on4abc
        their_exchange: [599, 1, mcl]
        their_continent: eu
        their_country: on
        band: 80m
        mode: cw
        points: 3
        multis: 1
        duplicate: false
      - their_call: on5xyz
        their_exchange: [599, 2, xxx]
        their_continent: eu
        their_country: on
        band: 80m
        mode: cw
        points: 3
        multis: 0
        duplicate: false
      - their_call: dl1abc
        their_exchange: [599, 3]
        their_continent: eu
        their_country: dl
        band: 80m
        mode: cw
        points: 3
        multis: 1
        duplicate: false
      - their_call: f1abc
