identifier: RSGB-COMMONWEALTH
name: Commonwealth (BERU) Contest
official_rules: https://www.rsgbcc.org/hf/rules/2026/rcwc.shtml
upload_url: https://www.rsgbcc.org/cgi-bin/hfenter.pl
upload_format: cabrillo
duration: 24h
duration-constraints:
breaks:
