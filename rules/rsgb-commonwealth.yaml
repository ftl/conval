    operator_mode: single
    tx: one
    power: high
    band_count: all
    modes: [cw]
    duration: 12h
  - name: HP-SOU 24 Hours
    operator_mode: single
    tx: one
    power: high
    band_count: all
    modes: [cw]
  - name: HP-SOA 12 Hours
    operator_mode: single
    tx: one
    power: high
    band_count: all
    modes: [cw]
    assisted: true
    duration: 12h
  - name: HP-SOA 24 Hours
    operator_mode: single
    tx: one
    power: high
    band_count: all
    modes: [cw]
    assisted: true
  - name: LP-SOU 12 Hours
    operator_mode: single
    tx: one
    power: low
    band_count: all
    modes: [cw]
    duration: 12h
  - name: LP-SOU 24 Hours
    operator_mode: single
    tx: one
    power: low
    band_count: all
    modes: [cw]
  - name: LP-SOA 12 Hours
    operator_mode: single
    tx: one
    power: low
    band_count: all
    modes: [cw]
    assisted: true
    duration: 12h
  - name: LP-SOA 24 Hours
    operator_mode: single
    tx: one
    power: low
    band_count: all
    modes: [cw]
    assisted: true
  - name: QRP
    operator_mode: single
    tx: one
    power: qrp
    band_count: all
    modes: [cw]
  - name: MULTI-OP
    operator_mode: multi
    band_count: all
    modes: [cw]
    assisted: true
  - name: HQ
    operator_mode: multi
    band_count: all
    modes: [cw]
    assisted: true
  - name: Checklog
overlays:
modes:
  - cw
bands:
  - 80m
  - 40m
  - 20m
  - 15m
  - 10m
band_change_rules:
properties:
exchange:
  - fields:
      - [rst]
      - [serial]
      - [commonwealth_hq, empty]
scoring:
  qsos:
    - my_country: [g, gd, gi, gj, gm, gu, gw]
      their_country: [g, gd, gi, gj, gm, gu, gw]
      property_constraints:
        - name: commonwealth_hq
          their_value_empty: true
      additional_weight: 50
      value: 0
    - property_constraints:
        - name: commonwealth_area
          same: true
        - name: commonwealth_hq
          their_value_empty: true
      additional_weight: 50
      value: 0
    - property_constraints:
        - name: commonwealth_area
          their_value_empty: true
      additional_weight: 50
      value: 0
    - their_continent: [same]
      value: 5
    - their_continent: [other]
      value: 10
  qso_band_rule: once_per_band
  multis:
    - property: commonwealth_area
      property_constraints:
        - name: commonwealth_area
          other: true
      band_rule: once_per_band
      count: 3
      value: 20
    - my_country: [g, gd, gi, gj, gm, gu, gw]
      their_country: [g, gd, gi, gj, gm, gu, gw]
      property: commonwealth_area
      property_constraints:
        - name: commonwealth_hq
          their_value_empty: true
      additional_weight: 50
      band_rule: once_per_band
      value: 0
  multi_operation: add
