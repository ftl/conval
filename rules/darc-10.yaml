    tx: one
    power: low
    bands: [all]
    modes: [cw, ssb]
  - name: SO Mixed High
    operator_mode: single
    tx: one
    power: high
    bands: [all]
    modes: [cw, ssb]
  - name: SO CW Low
    operator_mode: single
    tx: one
    power: low
    bands: [all]
    modes: [cw]
  - name: SO CW High
    operator_mode: single
    tx: one
    power: high
    bands: [all]
    modes: [cw]
  - name: SO SSB Low
    operator_mode: single
    tx: one
    power: low
    bands: [all]
    modes: [ssb]
  - name: SO SSB High
    operator_mode: single
    tx: one
    power: high
    bands: [all]
    modes: [ssb]
  - name: SO Mixed
    operator_mode: single
    tx: one
    bands: [all]
    modes: [cw, ssb]
  - name: SO CW
    operator_mode: single
    tx: one
    bands: [all]
    modes: [cw]
  - name: SO SSB
    operator_mode: single
    tx: one
    bands: [all]
    modes: [ssb]
  - name: Trainee
    operator_mode: single
    tx: one
    bands: [all]
    modes: [cw, ssb]
  - name: Checklog
overlays:
modes:
  - cw
  - ssb
bands:
  - 10m
band_change_rules:
properties:
  - name: wag_dok
    expression: "\\d*[A-Z][A-Z0-9ÄÖÜ-]*"
exchange:
  - their_country: [dl]
    fields:
      - [rst]
      - [serial]
      - [nm, wag_dok]
  - fields:
      - [rst]
      - [serial]
scoring:
  qsos:
    - value: 1
  qso_band_rule: once_per_band_and_mode
  multis:
    - property: wae_entity
      band_rule: once_per_band_and_mode
      value: 1
    - property: wag_dok
      band_rule: once_per_band_and_mode
      value: 1
