identifier: SARL-HF-CW
name: SARL HF CW Contest
official_rules: https://mysarl.org.za/wp-content/uploads/2025/11/2026-The-SARL-HF-Phone-Digital-and-CW-Contests-v1.1.pdf
upload_url: mailto:contest@sarl.org.za
upload_format: cabrillo
duration: 3h
duration-constraints:
breaks:
categories:
  - name: SOSB
    operator_mode: single
    tx: one
    band_count: single
    modes: [cw]
  - name: SOAB
    operator_mode: single
    tx: one
    band_count: all
    modes: [cw]
  - name: MOSB
    operator_mode: multi
    band_count: single
    modes: [cw]
  - name: MOAB
    operator_mode: multi
    band_count: all
    modes: [cw]
overlays:
  - yl
  - youth
modes:
  - cw
bands:
  - 80m
  - 40m
  - 20m
band_change_rules:
properties:
exchange:
  - fields:
      - [rst]
      - [serial]
scoring:
  qsos:
    - value: 1
  qso_band_rule: once_per_band
  multis:
    - property: sarl_area
      band_rule: once_per_band
      value: 2
  multi_operation: add
